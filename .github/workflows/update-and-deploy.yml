name: Update Leaderboard Data & Deploy GitHub Pages

on:
  schedule:
    # Lightweight hourly change-detection probe (only commits & redeploys when contentHash changes)
    - cron: "0 * * * *"
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages-deploy"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pyarrow
        run: python -m pip install --upgrade pip pyarrow

      - name: Probe & fetch latest official leaderboard data (Artificial Analysis + LMArena)
        run: python scripts/fetch_leaderboard.py

      - name: Detect changes & decide whether to commit/deploy
        id: check
        run: |
          CHANGED="$(git status --porcelain data/leaderboard.json assets/icons/)"
          if [ -n "$CHANGED" ] && { [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; }; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/leaderboard.json assets/icons/
            git commit -m "chore(data): sync AI LLM leaderboard ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "Content hash unchanged; skipping Pages rebuild."
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble clean static site artifact
        if: steps.check.outputs.should_deploy == 'true'
        run: |
          rm -rf _site
          mkdir -p _site/scripts
          cp index.html _site/
          cp -r styles _site/
          cp -r data _site/
          cp -r assets _site/
          cp scripts/app.js _site/scripts/

      - name: Setup Pages
        if: steps.check.outputs.should_deploy == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.check.outputs.should_deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

  deploy:
    needs: build
    if: needs.build.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
