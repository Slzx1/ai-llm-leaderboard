<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>ModelRank · 最新 AI 大模型多维度排行榜 (Artificial Analysis + LMArena 实时同步)</title>
  <meta name="description" content="权威、透明、定时自动更新的 AI 大模型多维度排行榜。以 Artificial Analysis Intelligence Index v5 为核心数据源（覆盖 Claude Fable 5.2、GPT-6.2 Astra/Sol、Gemini 4、Kimi K3.1、Qwen4、DeepSeek 等最新旗舰），辅以 LMArena 盲测榜，提供编程、推理、抗幻觉、速度与 API 价格全景对比。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    (function () {
      var mode = "auto";
      try {
        var saved = localStorage.getItem("modelrank_theme_mode") || localStorage.getItem("modelrank_theme");
        if (saved === "light" || saved === "dark" || saved === "auto") mode = saved;
      } catch (e) {}
      var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      var resolved = mode === "auto" ? (prefersDark ? "dark" : "light") : mode;
      document.documentElement.setAttribute("data-theme", resolved);
      document.documentElement.setAttribute("data-theme-mode", mode);
      var meta = document.querySelector('meta[name="color-scheme"]');
      if (meta) meta.setAttribute("content", mode === "auto" ? "light dark" : resolved);
    })();
  </script>
  <link rel="stylesheet" href="styles/main.css?v=6" />
</head>
<body>
  <!-- Compact Sticky Masthead -->
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <h1 class="brand-title">AI 大模型排行榜</h1>
        <span class="brand-sub">Artificial Analysis · LMArena 多维度权威榜单</span>
      </div>

      <div class="topbar-actions">
        <button id="btn-sources" class="sync-trigger" type="button" title="查看数据源与 SWR 刷新机制">
          <span class="sync-indicator" aria-hidden="true"></span>
          <span id="sync-status-label" class="sync-trigger-text">加载同步状态...</span>
        </button>

        <button id="btn-refresh" class="btn-ghost" type="button" title="从服务器立即拉取最新排行快照">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
            <path d="M3 3v5h5" />
            <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16" />
            <path d="M16 16h5v5" />
          </svg>
          <span>刷新排行</span>
        </button>

        <div id="theme-switcher" class="theme-switcher" role="group" aria-label="外观主题切换">
          <button class="theme-btn" data-theme-mode="light" type="button" title="固定使用浅色模式">浅色</button>
          <button class="theme-btn" data-theme-mode="dark" type="button" title="固定使用深色模式">深色</button>
          <button class="theme-btn" data-theme-mode="auto" type="button" title="自动跟随系统深浅色设置">自动</button>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content: Leaderboard Immediately Above the Fold -->
  <main class="page-shell">
    <!-- Track Switcher Tabs -->
    <nav class="track-nav-wrap" aria-label="评测维度赛道">
      <div id="track-tabs" class="track-tabs" role="tablist"></div>
    </nav>

    <!-- Compact Key Highlights Strip -->
    <section id="summary-strip" class="summary-strip" aria-label="当前赛道关键指标"></section>

    <!-- Track Description & Official Provenance -->
    <div id="track-desc-bar" class="track-desc-bar"></div>

    <!-- Search & Multi-Filter Toolbar -->
    <section class="toolbar" aria-label="排行榜筛选与排序控制">
      <div class="toolbar-left">
        <div class="search-box">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="8" />
            <path d="m21 21-4.3-4.3" />
          </svg>
          <input id="search-input" class="search-input" type="search" placeholder="搜索模型或厂商 (如 GPT-6.2, Fable, Gemini 4)..." autocomplete="off" />
          <button id="search-clear" class="search-clear" type="button" aria-label="清空搜索">×</button>
        </div>

        <div class="segmented" role="group" aria-label="开源与闭源筛选">
          <button class="seg-btn active" data-license="all" type="button">全部</button>
          <button class="seg-btn" data-license="open" type="button">仅开源</button>
          <button class="seg-btn" data-license="closed" type="button">仅闭源</button>
        </div>

        <select id="vendor-select" class="vendor-select" aria-label="按厂商筛选">
          <option value="all">全部厂商</option>
        </select>
      </div>

      <div class="toolbar-right">
        <label id="pareto-only-wrap" class="toggle-pill" title="仅保留当前筛选条件下的帕累托最优前沿模型（同价位智力最高或同智力成本最低）">
          <input id="pareto-only" type="checkbox" />
          <span>仅看帕累托最优</span>
        </label>

        <label id="dedup-release-wrap" class="toggle-pill active" title="同名模型的不同推理深度（如 max / xhigh / high / medium / low）仅保留当前排序下表现最优的一项">
          <input id="dedup-release" type="checkbox" checked />
          <span>同模型仅保留最优</span>
        </label>

        <label id="flagship-toggle-wrap" class="toggle-pill" title="每个厂商只保留当前排序维度下排名最高的一款旗舰模型">
          <input id="flagship-only" type="checkbox" />
          <span>仅看各厂商最强</span>
        </label>
      </div>
    </section>

    <!-- Top Vendors Quick Filter Chips (Official Logos) -->
    <div id="vendor-ribbon" class="vendor-ribbon" aria-label="热门厂商快速筛选"></div>

    <!-- Interactive Pareto Frontier Chart (visible on 帕累托性价比 track) -->
    <section id="pareto-section" class="pareto-card" style="display:none" aria-label="帕累托性价比前沿散点图"></section>

    <!-- Leaderboard Table -->
    <section class="table-card" aria-label="AI 大模型多维度排行榜表格">
      <div class="table-scroll">
        <table class="lb-table" id="leaderboard-table">
          <thead id="table-head"></thead>
          <tbody id="table-body">
            <tr>
              <td colspan="12" class="empty-state">正在加载最新权威排行榜数据...</td>
            </tr>
          </tbody>
        </table>
      </div>
      <div id="table-footer" class="table-footer"></div>
    </section>
  </main>

  <!-- Minimal Transparent Provenance Footer -->
  <footer class="site-footer">
    <div>
      数据完全来自 Artificial Analysis 与 LMArena 官方公开评测，厂商图标 100% 为官方原版资产（无自绘图标）。采用 SWR（先秒开缓存、后台静默校验更新）+ 后端每小时变更探测机制保持最新。
    </div>
    <div class="footer-links">
      <a href="https://artificialanalysis.ai/leaderboards/models" target="_blank" rel="noopener">Artificial Analysis 榜单</a>
      <a href="https://huggingface.co/datasets/lmarena-ai/leaderboard-dataset" target="_blank" rel="noopener">LMArena 官方数据集</a>
      <a href="https://github.com/Slzx1/ai-llm-leaderboard" target="_blank" rel="noopener">GitHub 源码与定时任务</a>
    </div>
  </footer>

  <!-- Slide-Over Model Detail Drawer -->
  <div id="drawer-backdrop" class="drawer-backdrop"></div>
  <aside id="detail-drawer" class="detail-drawer" aria-hidden="true" aria-label="模型多维能力详情">
    <div class="drawer-header">
      <div id="drawer-title-group" class="drawer-title-group"></div>
      <button id="drawer-close" class="btn-icon" type="button" aria-label="关闭详情">×</button>
    </div>
    <div id="drawer-body" class="drawer-body"></div>
    <div id="drawer-footer" class="drawer-footer"></div>
  </aside>

  <!-- Floating Multi-Model Compare Dock -->
  <div id="compare-dock" class="compare-dock" aria-live="polite">
    <div id="compare-dock-chips" class="compare-dock-chips"></div>
    <div style="display:flex;gap:6px;flex-shrink:0;">
      <button id="btn-clear-compare" class="btn-ghost" type="button">清空</button>
      <button id="btn-open-compare" class="btn-primary" type="button">多维雷达对比</button>
    </div>
  </div>

  <!-- Multi-Model Radar Comparison Modal -->
  <div id="compare-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="compare-modal-title">
    <div class="modal-panel">
      <div class="modal-head">
        <h2 id="compare-modal-title">多模型多维度能力对比</h2>
        <button id="compare-modal-close" class="btn-icon" type="button" aria-label="关闭对比弹窗">×</button>
      </div>
      <div id="compare-modal-body" class="modal-body"></div>
    </div>
  </div>

  <!-- Data Sources & Scheduled Auto-Update Modal -->
  <div id="sources-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="sources-modal-title">
    <div class="modal-panel narrow">
      <div class="modal-head">
        <h2 id="sources-modal-title">权威数据源与定时自动更新机制</h2>
        <button id="sources-modal-close" class="btn-icon" type="button" aria-label="关闭弹窗">×</button>
      </div>
      <div id="sources-modal-body" class="modal-body"></div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="scripts/app.js?v=6" defer></script>
</body>
</html>
