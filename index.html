<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="AI模型排行榜" />
  <title>ModelRank · AI模型排行榜</title>
  <meta name="description" content="权威、透明、自动同步更新的 AI模型排行榜。聚合 Artificial Analysis 独立综合基准与 LMArena 人类盲测榜，支持帕累托性价比前沿分析、编程、前沿学术难题、抗幻觉、推理速度与 API 价格全景对比。" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="256x256" href="assets/site-icon.png" />
  <link rel="shortcut icon" href="favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    (function () {
      var mode = "auto";
      try {
        var saved = localStorage.getItem("modelrank_theme_mode") || localStorage.getItem("modelrank_theme");
        if (saved === "light" || saved === "dark" || saved === "auto") mode = saved;
      } catch (e) {}
      var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      var resolved = mode === "auto" ? (prefersDark ? "dark" : "light") : mode;
      document.documentElement.setAttribute("data-theme", resolved);
      document.documentElement.setAttribute("data-theme-mode", mode);
      var meta = document.querySelector('meta[name="color-scheme"]');
      if (meta) meta.setAttribute("content", mode === "auto" ? "light dark" : resolved);
      var tc = document.querySelector('meta[name="theme-color"]');
      if (tc) tc.setAttribute("content", resolved === "dark" ? "#161920" : "#ffffff");
    })();
  </script>
  <link rel="stylesheet" href="styles/main.css?v=11" />
</head>
<body>
  <!-- Compact Sticky Masthead -->
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <img class="brand-logo" src="assets/site-icon.png" alt="AI模型排行榜" width="28" height="28" />
        <h1 class="brand-title">AI模型排行榜</h1>
        <span class="brand-sub">Artificial Analysis · LMArena 多维度权威榜单</span>
      </div>

      <div class="topbar-actions">
        <button id="btn-sources" class="sync-trigger" type="button" title="查看数据源与 SWR 刷新机制">
          <span class="sync-indicator" aria-hidden="true"></span>
          <span id="sync-status-label" class="sync-trigger-text">加载同步状态...</span>
        </button>

        <button id="btn-export" class="btn-ghost" type="button" title="导出排行榜、帕累托图或对比图为图片">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
            <polyline points="7 10 12 15 17 10" />
            <line x1="12" y1="15" x2="12" y2="3" />
          </svg>
          <span>导出图片</span>
        </button>

        <button id="btn-refresh" class="btn-ghost" type="button" title="从服务器立即拉取最新排行快照">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
            <path d="M3 3v5h5" />
            <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16" />
            <path d="M16 16h5v5" />
          </svg>
          <span>刷新排行</span>
        </button>

        <div id="theme-switcher" class="theme-switcher" role="group" aria-label="外观主题切换">
          <button class="theme-btn" data-theme-mode="light" type="button" title="固定使用浅色模式">浅色</button>
          <button class="theme-btn" data-theme-mode="dark" type="button" title="固定使用深色模式">深色</button>
          <button class="theme-btn" data-theme-mode="auto" type="button" title="自动跟随系统深浅色设置">自动</button>
        </div>

        <button id="btn-theme-mobile" class="btn-icon mobile-only-btn" type="button" title="切换浅色 / 深色 / 自动主题" aria-label="切换主题">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2" /><path d="M12 20v2" /><path d="m4.93 4.93 1.41 1.41" /><path d="m17.66 17.66 1.41 1.41" /><path d="M2 12h2" /><path d="M20 12h2" /><path d="m6.34 17.66-1.41 1.41" /><path d="m19.07 4.93-1.41 1.41" />
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content: Leaderboard Immediately Above the Fold -->
  <main class="page-shell">
    <!-- Track Switcher Tabs -->
    <nav class="track-nav-wrap" aria-label="评测维度赛道">
      <div id="track-tabs" class="track-tabs" role="tablist"></div>
    </nav>

    <!-- Compact Key Highlights Strip -->
    <section id="summary-strip" class="summary-strip" aria-label="当前赛道关键指标"></section>

    <!-- Track Description & Official Provenance -->
    <div id="track-desc-bar" class="track-desc-bar"></div>

    <!-- Search & Multi-Filter Toolbar -->
    <section id="toolbar" class="toolbar" aria-label="排行榜筛选与排序控制">
      <div class="toolbar-left">
        <div class="search-row-wrap">
          <div class="search-box">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="11" cy="11" r="8" />
              <path d="m21 21-4.3-4.3" />
            </svg>
            <input id="search-input" class="search-input" type="search" placeholder="搜索模型名称或厂商..." autocomplete="off" />
            <button id="search-clear" class="search-clear" type="button" aria-label="清空搜索">×</button>
          </div>
          <button id="btn-mobile-filter" class="btn-ghost mobile-filter-btn" type="button" aria-expanded="false" aria-controls="toolbar">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3" />
            </svg>
            <span>筛选</span>
            <span id="mobile-filter-badge" class="mobile-filter-badge" style="display:none">0</span>
          </button>
        </div>

        <div class="segmented" role="group" aria-label="开源与闭源筛选">
          <button class="seg-btn active" data-license="all" type="button">全部</button>
          <button class="seg-btn" data-license="open" type="button">仅开源</button>
          <button class="seg-btn" data-license="closed" type="button">仅闭源</button>
        </div>

        <select id="vendor-select" class="vendor-select" aria-label="按厂商筛选">
          <option value="all">全部厂商</option>
        </select>
      </div>

      <div class="toolbar-right">
        <label id="pareto-only-wrap" class="toggle-pill" title="仅保留当前筛选条件下的帕累托最优前沿模型（同价位智力最高或同智力成本最低）">
          <input id="pareto-only" type="checkbox" />
          <span>仅看帕累托最优</span>
        </label>

        <label id="dedup-release-wrap" class="toggle-pill active" title="同名模型的不同推理深度（如 max / xhigh / high / medium / low）仅保留当前排序下表现最优的一项">
          <input id="dedup-release" type="checkbox" checked />
          <span>同模型仅保留最优</span>
        </label>

        <label id="flagship-toggle-wrap" class="toggle-pill" title="每个厂商只保留当前排序维度下排名最高的一款旗舰模型">
          <input id="flagship-only" type="checkbox" />
          <span>仅看各厂商最强</span>
        </label>
      </div>
    </section>

    <!-- Top Vendors Quick Filter Chips (Official Logos) -->
    <div id="vendor-ribbon" class="vendor-ribbon" aria-label="热门厂商快速筛选"></div>

    <!-- Interactive Pareto Frontier Chart (visible on 帕累托性价比 track) -->
    <section id="pareto-section" class="pareto-card" style="display:none" aria-label="帕累托性价比前沿散点图"></section>

    <!-- Leaderboard Table -->
    <section class="table-card" aria-label="AI 大模型多维度排行榜表格">
      <div class="table-scroll">
        <table class="lb-table" id="leaderboard-table">
          <thead id="table-head"></thead>
          <tbody id="table-body">
            <tr>
              <td colspan="12" class="empty-state">正在加载最新权威排行榜数据...</td>
            </tr>
          </tbody>
        </table>
      </div>
      <div id="table-footer" class="table-footer"></div>
    </section>
  </main>

  <!-- Minimal Transparent Provenance Footer -->
  <footer class="site-footer">
    <div>
      数据完全来自 Artificial Analysis 与 LMArena 官方公开评测，厂商图标 100% 为官方原版资产（无自绘图标）。采用 SWR（先秒开缓存、后台静默校验更新）+ 后端每小时变更探测机制保持最新。
    </div>
    <div class="footer-links">
      <a href="https://artificialanalysis.ai/leaderboards/models" target="_blank" rel="noopener">Artificial Analysis 榜单</a>
      <a href="https://huggingface.co/datasets/lmarena-ai/leaderboard-dataset" target="_blank" rel="noopener">LMArena 官方数据集</a>
      <a href="https://github.com/Slzx1/ai-llm-leaderboard" target="_blank" rel="noopener">GitHub 源码与定时任务</a>
    </div>
  </footer>

  <!-- Slide-Over Model Detail Drawer -->
  <div id="drawer-backdrop" class="drawer-backdrop"></div>
  <aside id="detail-drawer" class="detail-drawer" aria-hidden="true" aria-label="模型多维能力详情">
    <div class="drawer-header">
      <div id="drawer-title-group" class="drawer-title-group"></div>
      <button id="drawer-close" class="btn-icon" type="button" aria-label="关闭详情">×</button>
    </div>
    <div id="drawer-body" class="drawer-body"></div>
    <div id="drawer-footer" class="drawer-footer"></div>
  </aside>

  <!-- Floating Multi-Model Compare Dock -->
  <div id="compare-dock" class="compare-dock" aria-live="polite">
    <div id="compare-dock-chips" class="compare-dock-chips"></div>
    <div style="display:flex;gap:6px;flex-shrink:0;">
      <button id="btn-clear-compare" class="btn-ghost" type="button">清空</button>
      <button id="btn-open-compare" class="btn-primary" type="button">多维雷达对比</button>
    </div>
  </div>

  <!-- Multi-Model Radar Comparison Modal -->
  <div id="compare-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="compare-modal-title">
    <div class="modal-panel">
      <div class="modal-head">
        <h2 id="compare-modal-title">多模型多维度能力对比</h2>
        <div class="modal-head-actions">
          <button id="btn-export-compare" class="btn-ghost" type="button" title="导出当前雷达图与多维对比表为图片">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
              <polyline points="7 10 12 15 17 10" />
              <line x1="12" y1="15" x2="12" y2="3" />
            </svg>
            <span>导出对比图</span>
          </button>
          <button id="compare-modal-close" class="btn-icon" type="button" aria-label="关闭对比弹窗">×</button>
        </div>
      </div>
      <div id="compare-modal-body" class="modal-body"></div>
    </div>
  </div>

  <!-- Export Leaderboard / Chart Image Modal -->
  <div id="export-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="export-modal-title">
    <div class="modal-panel export-modal-panel">
      <div class="modal-head">
        <h2 id="export-modal-title">导出图片</h2>
        <button id="export-modal-close" class="btn-icon" type="button" aria-label="关闭导出弹窗">×</button>
      </div>
      <div class="modal-body export-modal-body">
        <div class="export-layout">
          <div class="export-controls">
            <div class="export-field">
              <div class="export-field-label">选择导出内容</div>
              <div id="export-type-grid" class="export-type-grid" role="radiogroup" aria-label="导出内容类型">
                <button class="export-type-card active" data-export-type="table" type="button">
                  <span class="export-type-title">排行榜表格</span>
                  <span class="export-type-sub">任选赛道完整多列排名</span>
                </button>
                <button class="export-type-card" data-export-type="pareto" type="button">
                  <span class="export-type-title">帕累托性价比图</span>
                  <span class="export-type-sub">前沿曲线与性价比分布</span>
                </button>
                <button class="export-type-card" data-export-type="combined" type="button">
                  <span class="export-type-title">帕累托图 + 排行表</span>
                  <span class="export-type-sub">图表与榜单合成一张长图</span>
                </button>
                <button class="export-type-card" data-export-type="compare" type="button">
                  <span class="export-type-title">多模型雷达对比</span>
                  <span class="export-type-sub" id="export-compare-hint">需先勾选 ≥2 款模型</span>
                </button>
              </div>
            </div>

            <div class="export-field" id="export-track-field">
              <label class="export-field-label" for="export-track-select">目标排行榜赛道</label>
              <select id="export-track-select" class="export-select"></select>
            </div>

            <div class="export-field-row" id="export-table-opts">
              <div class="export-field">
                <label class="export-field-label" for="export-limit-select">展示模型数量</label>
                <select id="export-limit-select" class="export-select">
                  <option value="10">Top 10（精简长图）</option>
                  <option value="20" selected>Top 20（推荐）</option>
                  <option value="30">Top 30</option>
                  <option value="50">最多 50 款</option>
                </select>
              </div>

              <div class="export-field">
                <label class="export-field-label" for="export-scope-select">数据范围</label>
                <select id="export-scope-select" class="export-select">
                  <option value="current">跟随当前筛选与排序</option>
                  <option value="full">全赛道默认完整榜</option>
                </select>
              </div>
            </div>

            <div class="export-field-row" id="export-pareto-opts" style="display:none">
              <div class="export-field">
                <label class="export-field-label" for="export-pareto-mode">帕累托横轴维度</label>
                <select id="export-pareto-mode" class="export-select">
                  <option value="priceBlended">综合价 ($/1M Tokens)</option>
                  <option value="costPerTask">单任务成本 ($/Task)</option>
                  <option value="outputSpeed">输出速度 (tok/s)</option>
                </select>
              </div>

              <div class="export-field">
                <label class="export-field-label" for="export-pareto-scale">坐标轴刻度</label>
                <select id="export-pareto-scale" class="export-select">
                  <option value="log">对数刻度 (Log)</option>
                  <option value="linear">线性刻度 (Linear)</option>
                </select>
              </div>
            </div>

            <div class="export-field">
              <div class="export-field-label">导出配色主题</div>
              <div id="export-theme-seg" class="segmented export-theme-seg" role="group" aria-label="导出图片主题">
                <button class="seg-btn active" data-export-theme="current" type="button">跟随当前</button>
                <button class="seg-btn" data-export-theme="light" type="button">浅色版</button>
                <button class="seg-btn" data-export-theme="dark" type="button">深色版</button>
              </div>
            </div>

            <div class="export-actions">
              <button id="btn-export-download" class="btn-primary" type="button">下载高清 PNG</button>
              <button id="btn-export-copy" class="btn-ghost" type="button">复制图片</button>
            </div>
          </div>

          <div class="export-preview-pane">
            <div class="export-preview-head">
              <span>实时预览</span>
              <span id="export-preview-meta" class="mono">准备生成...</span>
            </div>
            <div class="export-preview-stage" id="export-preview-stage">
              <div id="export-preview-loading" class="export-preview-loading">正在生成预览...</div>
              <img id="export-preview-img" class="export-preview-img" alt="导出图片预览" style="display:none" />
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Data Sources & Scheduled Auto-Update Modal -->
  <div id="sources-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="sources-modal-title">
    <div class="modal-panel narrow">
      <div class="modal-head">
        <h2 id="sources-modal-title">权威数据源与定时自动更新机制</h2>
        <button id="sources-modal-close" class="btn-icon" type="button" aria-label="关闭弹窗">×</button>
      </div>
      <div id="sources-modal-body" class="modal-body"></div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="scripts/exporter.js?v=12" defer></script>
  <script src="scripts/app.js?v=12" defer></script>
</body>
</html>
